name: Forward secret scan

on:
  push:
    branches: ['**']
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch Git history without checking out the PR
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/workflows/forward-secret-scan.yml
          submodules: false
          lfs: false
      - name: Verify scanner and set trusted rules
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools="$RUNNER_TEMP/forward-secret-scan"
          mkdir -m 700 "$tools"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --max-time 90 --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools/scanner.tar.gz"
          ( cd "$tools" && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check --status )
          tar -xzOf "$tools/scanner.tar.gz" gitleaks > "$tools/gitleaks"
          chmod 700 "$tools/gitleaks"
          : > "$tools/.gitleaksignore"
          cat > "$tools/rules.toml" <<'RULES'
          title = "Forward credential scan"
          [extend]
          useDefault = true
          [[rules]]
          id = "credentialed-database-url"
          description = "Database or broker URL carrying a literal password"
          regex = '''(?i)(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|amqps?|rediss?)://[^\s/@:]{0,96}:([^\s/@$<>{}]{5,160})@'''
          secretGroup = 1
          [[rules]]
          id = "pgpassword-assignment"
          description = "Literal PostgreSQL password assignment"
          regex = '''(?i)\bPGPASSWORD\s*=\s*["']?([A-Za-z0-9/+_.!@#%&^:-]{6,128})'''
          secretGroup = 1
          RULES
      - name: Scan newly reachable commits
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          umask 077
          tools="$RUNNER_TEMP/forward-secret-scan"
          fetch_ref() {
            # A read-only token is available only for this authenticated fetch.
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)" \
              git fetch --quiet --no-tags origin "$1"
          }
          commit() { [[ "$1" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [[ "$EVENT" == pull_request_target ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
            commit "$PR_BASE"
            fetch_ref "+refs/pull/$PR_NUMBER/head:refs/forward-scan/head"
            commit "$PR_HEAD"
            [[ "$(git rev-parse refs/forward-scan/head)" == "$PR_HEAD" ]]
            revisions="$PR_BASE..$PR_HEAD"
          else
            commit "$AFTER"
            if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              revisions="$AFTER"
              if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                git check-ref-format "refs/heads/$DEFAULT_BRANCH" >/dev/null
                default=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")
                revisions="$default..$AFTER"
              fi
            else
              [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
              if ! commit "$BEFORE"; then
                fetch_ref "$BEFORE"
              fi
              commit "$BEFORE"
              revisions="$BEFORE..$AFTER"
            fi
          fi
          unset READ_TOKEN
          # Only immutable Git objects are scanned. A merge's resolution and a new
          # root commit are included, even when a later commit removes the added text.
          objects=$(git rev-parse --absolute-git-dir)
          cd "$tools"
          if "$tools/gitleaks" git --config "$tools/rules.toml" \
            --gitleaks-ignore-path "$tools/.gitleaksignore" --ignore-gitleaks-allow \
            --no-banner --no-color --redact=100 --log-level error --exit-code 23 \
            --timeout 900 --log-opts="--root --full-history --diff-merges=first-parent --text --no-ext-diff --no-textconv $revisions" \
            "$objects" >/dev/null 2>&1; then
            echo 'Secret scan passed.'
          else
            result=$?
            if [[ "$result" == 23 ]]; then
              echo '::error::Possible credential in newly reachable commits. Inspect the changes privately.'
            else
              echo '::error::Secret scan did not complete. Check scanner availability and Git history.'
            fi
            exit 1
          fi
